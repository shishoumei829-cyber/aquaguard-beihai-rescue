<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaGuard 地图透明叠层</title>
<link rel="stylesheet" href="aquaguard-lumina.css">
<link rel="stylesheet" href="aquaguard-glimmer-display.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #eef1f6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
</style>
</head>
<body>

<div class="overlay-display">
  <div class="overlay-display__map"></div>

  <div class="overlay-ambient overlay-glass">
    <span class="overlay-ambient__icon material-symbols-outlined">emergency</span>
    新 SOS 事件 · B-3 泳区
  </div>

  <button class="overlay-action is-focused" type="button">
    <span class="material-symbols-outlined">navigation</span>
    导航前往
  </button>

  <article class="overlay-rescue overlay-glass">
    <p class="overlay-rescue__eyebrow">紧急求救</p>
    <h2 class="overlay-rescue__title">儿童 · 手环 A-2213</h2>
    <div class="overlay-rescue__row">
      <span class="overlay-rescue__distance">128<small>m</small></span>
      <span class="overlay-rescue__meta">心率 142 · B-3 泳区</span>
    </div>
  </article>
</div>

</body>
</html>
